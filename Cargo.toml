[package]
name = "pbcopy"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cpy"
path = "src/cpy.rs"

[[bin]]
name = "cpp"
path = "src/cpp.rs"

[dependencies]
arboard = "3"
anyhow = "1"
encoding_rs = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Console",
] }

# Minimal dependencies to keep the tool lightweight and cross-platform.
